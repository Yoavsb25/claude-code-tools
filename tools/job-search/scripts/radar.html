<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Radar</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<style>
  :root {
    --bg: #f7f7f5; --surface: #ffffff; --surface-2: #f0efeb; --border: #e3e1db;
    --text: #1d1c1a; --muted: #6b6860; --accent: #2f5bd3; --accent-soft: #e6ecfb;
    --good: #1f7a4d; --good-soft: #e3f3ea; --warn: #9a5b00; --warn-soft: #fbefd9;
    --bad: #b3261e; --bad-soft: #fbe4e2; --new: #6d28d9; --new-soft: #efe7fd;
    --radius: 10px; --shadow: 0 1px 2px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --surface: #1d1d1b; --surface-2: #262623; --border: #34332f;
      --text: #ecebe6; --muted: #9b988f; --accent: #8aa8ff; --accent-soft: #232c45;
      --good: #6fcf97; --good-soft: #1c3326; --warn: #f2b65c; --warn-soft: #3a2d17;
      --bad: #ff8a80; --bad-soft: #3d1f1d; --new: #c4a7ff; --new-soft: #2d2342;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--border); }
  .bar { max-width: 1180px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0 8px 0 0; letter-spacing: -.01em; }
  .meta { color: var(--muted); font-size: 12.5px; }
  .tabs { display: flex; gap: 4px; margin-left: auto; }
  .tab { border: 0; background: none; color: var(--muted); padding: 6px 10px; border-radius: 8px; cursor: pointer; font: inherit; }
  .tab[aria-selected="true"] { background: var(--surface-2); color: var(--text); font-weight: 600; }
  button, select, input { font: inherit; color: inherit; }
  .btn { white-space: nowrap; border: 1px solid var(--border); background: var(--surface); padding: 5px 10px; border-radius: 8px; cursor: pointer; }
  .btn:hover { border-color: var(--muted); }
  a.btn { text-decoration: none; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .55; cursor: default; }
  main { max-width: 1180px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: 260px 1fr; gap: 20px; }
  main.wide { grid-template-columns: 1fr; }
  aside { position: sticky; top: 70px; align-self: start; display: flex; flex-direction: column; gap: 16px;
    max-height: calc(100vh - 90px); overflow: auto; padding-right: 4px; }
  .group h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 3px 9px; cursor: pointer; font-size: 12.5px; }
  .chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  input[type=search], select.field, input[type=number] { width: 100%; padding: 7px 9px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--surface); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  label.check { display: flex; gap: 7px; align-items: center; font-size: 13px; cursor: pointer; margin-top: 4px; }
  .summary { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 10px; flex-wrap: wrap; }
  .summary strong { font-size: 15px; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card.closed { opacity: .6; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 11px 13px; cursor: pointer; }
  .title { font-weight: 600; font-size: 14.5px; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 1px; }
  .badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .badge { font-size: 11.5px; padding: 1px 7px; border-radius: 6px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .badge.good { background: var(--good-soft); color: var(--good); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.bad { background: var(--bad-soft); color: var(--bad); }
  .badge.new { background: var(--new-soft); color: var(--new); font-weight: 600; }
  .actions { display: flex; gap: 6px; align-items: flex-start; }
  .actions select { padding: 5px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); cursor: pointer; }
  .saved { color: var(--good); font-weight: 600; font-size: 13px; padding: 5px 4px; }
  .detail { border-top: 1px solid var(--border); padding: 12px 13px 14px; display: none; }
  .card.open .detail { display: block; }
  .evidence { background: var(--accent-soft); border-left: 3px solid var(--accent); padding: 8px 10px; border-radius: 6px; margin-bottom: 10px; font-size: 13px; }
  .evidence b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); margin-bottom: 2px; }
  .desc { white-space: pre-wrap; color: var(--text); font-size: 13px; max-height: 360px; overflow: auto; }
  .links { margin-top: 10px; display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; }
  a { color: var(--accent); }
  .empty, .notice { padding: 28px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius); }
  .notice { padding: 10px 14px; text-align: left; margin-bottom: 12px; border-style: solid; }
  .notice.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; background: var(--surface-2); }
  .cov-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; align-items: start; }
  .stat-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; min-width: 120px; }
  .stat div:first-child { font-size: 20px; font-weight: 700; }
  .stat div:last-child { color: var(--muted); font-size: 12px; }
  .more { margin: 12px auto 0; display: block; }
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; }
    aside { position: static; max-height: none; }
    .cov-grid { grid-template-columns: 1fr; }
    .row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Job Radar</h1>
    <span class="meta" id="updated">Loading…</span>
    <button class="btn" id="refreshBtn" type="button">Refresh now</button>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="roles" aria-selected="true">Roles</button>
      <button class="tab" role="tab" data-tab="saved" aria-selected="false">Saved</button>
      <button class="tab" role="tab" data-tab="hidden" aria-selected="false">Hidden</button>
      <button class="tab" role="tab" data-tab="coverage" aria-selected="false">Coverage</button>
    </nav>
  </div>
</header>
<main id="main">
  <aside id="filters">
    <div class="group">
      <input type="search" id="q" placeholder="Search title, company, text…" aria-label="Search">
    </div>
    <div class="group">
      <h3>Years required: ≤ <span id="yearsVal"></span></h3>
      <input type="range" id="maxYears" min="0" max="10" step="1" aria-label="Maximum years required">
      <label class="check"><input type="checkbox" id="includeUnknown"> Include roles that don't say</label>
    </div>
    <div class="group">
      <h3>Show only</h3>
      <label class="check"><input type="checkbox" id="newOnly"> New since last visit</label>
      <label class="check"><input type="checkbox" id="showClosed"> Include closed postings</label>
      <label class="check"><input type="checkbox" id="hideRecruiters"> Hide recruitment agencies</label>
    </div>
    <div class="group">
      <h3>Role family</h3>
      <div class="chips" id="families"></div>
    </div>
    <div class="group">
      <h3>Level (from title)</h3>
      <div class="chips" id="levels"></div>
    </div>
    <div class="group">
      <h3>Minimum salary (if stated)</h3>
      <select class="field" id="minSalary">
        <option value="0">Any</option><option value="55000">£55k+</option>
        <option value="65000">£65k+</option><option value="80000">£80k+</option>
      </select>
      <label class="check"><input type="checkbox" id="salaryOnly"> Only roles that state a salary</label>
    </div>
    <div class="group">
      <h3>Source</h3>
      <div class="chips" id="sources"></div>
    </div>
    <div class="group">
      <h3>Sort</h3>
      <select class="field" id="sort">
        <option value="new">Newest first</option>
        <option value="years">Fewest years first</option>
        <option value="company">Company A–Z</option>
      </select>
    </div>
    <button class="btn" id="reset" type="button">Reset filters</button>
  </aside>
  <section id="content"></section>
</main>

<script>
const FAMILIES = ["AI/FDE", "Platform/DevEx", "SWE", "Solutions", "TPM/Program", "Data/ML", "QA/Automation", "Security/IT", "Product", "Other", "Non-tech"];
const LEVELS = ["intern", "entry", "junior", "mid", "mid/senior", "unknown", "senior", "staff+", "manager"];
const HIDE_REASONS = ["too senior", "wrong work", "pay", "company", "other"];
const DEFAULTS = {
  q: "", maxYears: 3, includeUnknown: true, newOnly: false, showClosed: false, hideRecruiters: true,
  families: FAMILIES.filter(f => f !== "Non-tech"),
  levels: LEVELS.filter(l => !["senior", "staff+", "manager"].includes(l)),
  sources: null, minSalary: 0, salaryOnly: false, sort: "new",
};
const PAGE_SIZE = 120;

let data = null, prevVisit = null, visited = false, tab = "roles", shown = PAGE_SIZE;
const openKeys = new Set();
let filters = loadFilters();

function loadFilters() {
  try { return { ...DEFAULTS, ...JSON.parse(localStorage.getItem("radar-filters") || "{}") }; }
  catch { return { ...DEFAULTS }; }
}
function storeFilters() {
  try { localStorage.setItem("radar-filters", JSON.stringify(filters)); } catch {}
}

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) {
    if (c === null || c === undefined || c === false) continue;
    node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return node;
}

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  const json = await res.json();
  if (!res.ok) throw new Error(json.error || res.statusText);
  return json;
}

async function load() {
  data = await api("/api/data");
  if (!visited) {
    prevVisit = data.page_state.last_visit;
    visited = true;
    api("/api/visit", {}).catch(() => {});
  }
  if (!filters.sources) filters.sources = sources();
  renderHeader();
  renderFilters();
  render();
  if (data.refreshing) pollRefresh();
}

function sources() {
  return [...new Set(data.postings.map(p => p.source))].sort();
}

function ago(iso) {
  if (!iso) return "never";
  const mins = Math.round((Date.now() - new Date(iso)) / 60000);
  if (mins < 2) return "just now";
  if (mins < 60) return `${mins} min ago`;
  const hours = Math.round(mins / 60);
  return hours < 36 ? `${hours} h ago` : `${Math.round(hours / 24)} days ago`;
}

function renderHeader() {
  const btn = document.getElementById("refreshBtn");
  btn.disabled = data.refreshing;
  btn.textContent = data.refreshing ? "Refreshing…" : "Refresh now";
  document.getElementById("updated").textContent =
    `Updated ${ago(data.updated_at)}` + (prevVisit ? ` · last visit ${ago(prevVisit)}` : "");
}

function isNew(p) {
  if (!prevVisit) return false;
  return p.first_seen > prevVisit.slice(0, 10);
}

function chipGroup(id, values, key) {
  const box = document.getElementById(id);
  box.replaceChildren(...values.map(v => el("button", {
    class: "chip", type: "button", "aria-pressed": String(filters[key].includes(v)),
    onclick: () => {
      filters[key] = filters[key].includes(v) ? filters[key].filter(x => x !== v) : [...filters[key], v];
      changed();
    },
  }, v)));
}

function renderFilters() {
  document.getElementById("q").value = filters.q;
  document.getElementById("maxYears").value = filters.maxYears;
  document.getElementById("yearsVal").textContent = filters.maxYears >= 10 ? "any" : filters.maxYears;
  document.getElementById("includeUnknown").checked = filters.includeUnknown;
  document.getElementById("newOnly").checked = filters.newOnly;
  document.getElementById("showClosed").checked = filters.showClosed;
  document.getElementById("hideRecruiters").checked = filters.hideRecruiters;
  document.getElementById("minSalary").value = filters.minSalary;
  document.getElementById("salaryOnly").checked = filters.salaryOnly;
  document.getElementById("sort").value = filters.sort;
  chipGroup("families", FAMILIES, "families");
  chipGroup("levels", LEVELS, "levels");
  chipGroup("sources", sources(), "sources");
}

function changed() {
  shown = PAGE_SIZE;
  storeFilters();
  renderFilters();
  render();
}

function matches(p) {
  const f = filters;
  if (!f.showClosed && p.closed) return false;
  if (f.newOnly && !isNew(p)) return false;
  if (f.hideRecruiters && (p.flags || []).includes("recruiter")) return false;
  if (p.years_min === null || p.years_min === undefined) {
    if (!f.includeUnknown) return false;
  } else if (f.maxYears < 10 && p.years_min > f.maxYears) return false;
  if (!f.families.includes(p.role_family)) return false;
  if (!f.levels.includes(p.level)) return false;
  if (!f.sources.includes(p.source)) return false;
  if (f.salaryOnly && !p.salary_min) return false;
  if (f.minSalary && p.salary_min && p.salary_min < f.minSalary) return false;
  if (f.q) {
    const hay = `${p.title} ${p.company} ${p.location} ${p.description || ""}`.toLowerCase();
    if (!f.q.toLowerCase().split(/\s+/).every(t => hay.includes(t))) return false;
  }
  return true;
}

function sortPostings(list) {
  const by = {
    new: (a, b) => (b.first_seen || "").localeCompare(a.first_seen || "") || (a.years_min ?? 99) - (b.years_min ?? 99),
    years: (a, b) => (a.years_min ?? 99) - (b.years_min ?? 99) || (b.first_seen || "").localeCompare(a.first_seen || ""),
    company: (a, b) => (a.company || "").localeCompare(b.company || "") || a.title.localeCompare(b.title),
  }[filters.sort];
  return list.sort(by);
}

function yearsBadge(p) {
  if (p.years_min === null || p.years_min === undefined) return el("span", { class: "badge" }, "? yrs");
  const cls = p.years_min <= 2 ? "good" : p.years_min <= 3 ? "warn" : "bad";
  return el("span", { class: `badge ${cls}` }, `${p.years_min}+ yrs`);
}

function card(p) {
  const state = data.page_state;
  const saved = state.saved[p.key];
  const hidden = state.hidden[p.key];
  const node = el("article", { class: `card${p.closed ? " closed" : ""}${openKeys.has(p.key) ? " open" : ""}` });

  const actions = el("div", { class: "actions", onclick: e => e.stopPropagation() });
  if (hidden) {
    actions.append(el("button", { class: "btn", type: "button", onclick: () => unhide(p) }, `Unhide (${hidden.reason})`));
  } else {
    actions.append(saved
      ? el("span", { class: "saved" }, "✓ Saved")
      : el("button", { class: "btn primary", type: "button", onclick: () => save(p) }, "☆ Save"));
    const select = el("select", { "aria-label": "Hide this role", onchange: e => hide(p, e.target.value) },
      el("option", { value: "" }, "Hide…"), ...HIDE_REASONS.map(r => el("option", { value: r }, r)));
    actions.append(select);
  }
  actions.append(el("a", { class: "btn", href: p.url, target: "_blank", rel: "noopener" }, "Open ↗"));

  const badges = el("div", { class: "badges" },
    isNew(p) && el("span", { class: "badge new" }, "NEW"),
    yearsBadge(p),
    el("span", { class: "badge" }, p.role_family),
    p.level !== "unknown" && el("span", { class: "badge" }, p.level),
    p.salary && el("span", { class: "badge good" }, p.salary),
    el("span", { class: "badge" }, (p.sources || [p.source]).join(" + ")),
    p.flags && p.flags.includes("deal_breaker") && el("span", { class: "badge bad" }, "gambling?"),
    p.flags && p.flags.includes("recruiter") && el("span", { class: "badge warn" }, "agency"),
    p.closed && el("span", { class: "badge bad" }, "closed"),
    el("span", { class: "badge" }, `seen ${p.first_seen}`),
  );

  node.append(el("div", {
    class: "row", onclick: () => {
      openKeys.has(p.key) ? openKeys.delete(p.key) : openKeys.add(p.key);
      node.classList.toggle("open");
    },
  }, el("div", {}, el("div", { class: "title" }, p.title), el("div", { class: "sub" }, `${p.company} · ${p.location || "—"}`), badges), actions));

  const detail = el("div", { class: "detail" },
    p.years_evidence
      ? el("div", { class: "evidence" }, el("b", {}, `Why "${p.years_min}+ yrs"`), p.years_evidence)
      : el("div", { class: "evidence" }, el("b", {}, "Years"), p.description ? "The job ad doesn't state a number of years." : "No job ad text fetched yet (LinkedIn details are capped per day)."),
    p.description && el("div", { class: "desc" }, p.description),
    el("div", { class: "links" },
      el("a", { href: p.url, target: "_blank", rel: "noopener" }, "Original posting ↗"),
      ...(p.alt_urls || []).map(u => el("a", { href: u, target: "_blank", rel: "noopener" }, "Also on " + new URL(u).hostname.replace("www.", "") + " ↗")),
    ),
  );
  node.append(detail);
  return node;
}

function render() {
  const main = document.getElementById("main");
  const content = document.getElementById("content");
  const filtersEl = document.getElementById("filters");
  main.classList.toggle("wide", tab === "coverage");
  filtersEl.hidden = tab === "coverage";
  if (tab === "coverage") return content.replaceChildren(renderCoverage());

  const { hidden, saved } = data.page_state;
  let list;
  if (tab === "saved") list = data.postings.filter(p => saved[p.key]);
  else if (tab === "hidden") list = data.postings.filter(p => hidden[p.key]);
  else list = data.postings.filter(p => !hidden[p.key] && !saved[p.key] && matches(p));
  sortPostings(list);

  const openCount = data.postings.filter(p => !p.closed).length;
  const newCount = list.filter(isNew).length;
  const notices = [];
  if (data.refreshing) notices.push(el("div", { class: "notice" }, "Refreshing in the background. New roles will appear when it finishes (about 3 minutes)."));
  if (data.refresh_error) notices.push(el("div", { class: "notice warn" }, `Last refresh failed: ${data.refresh_error}`));

  const heading = {
    roles: [el("strong", {}, `${list.length} roles`), ` match your filters, out of ${openCount} open` + (newCount ? ` · ${newCount} new` : "")],
    saved: [el("strong", {}, `${list.length} saved`), " · also in your tracker (Tracker.md)"],
    hidden: [el("strong", {}, `${list.length} hidden`), " · they won't show in Roles again"],
  }[tab];

  const listEl = el("div", { class: "list" }, ...list.slice(0, shown).map(card));
  content.replaceChildren(
    ...notices,
    el("div", { class: "summary" }, el("div", {}, ...heading)),
    list.length ? listEl : el("div", { class: "empty" }, tab === "roles" ? "Nothing matches. Try loosening the years slider or level filters." : "Nothing here yet."),
    list.length > shown && el("button", { class: "btn more", type: "button", onclick: () => { shown += PAGE_SIZE; render(); } }, `Show ${Math.min(PAGE_SIZE, list.length - shown)} more`),
  );
}

function renderCoverage() {
  const cov = data.coverage;
  if (!cov) return el("div", { class: "empty" }, "No coverage data yet. Run a refresh.");
  const companies = cov.companies;
  const fetched = companies.filter(c => c.ok !== null && c.ok !== undefined);
  const failing = companies.filter(c => c.ok === false);
  const li = cov.linkedin || {};
  const status = c => c.linkedin_only ? el("span", { class: "badge" }, "LinkedIn only")
    : c.ok ? el("span", { class: "badge good" }, "ok") : el("span", { class: "badge bad" }, "failing");
  const rows = [...companies].sort((a, b) => (a.ok === false ? -1 : 0) - (b.ok === false ? -1 : 0) || (b.london ?? -1) - (a.london ?? -1));
  return el("div", {},
    el("div", { class: "stat-row" },
      el("div", { class: "stat" }, el("div", {}, fetched.length), el("div", {}, "career pages checked")),
      el("div", { class: "stat" }, el("div", {}, failing.length), el("div", {}, "failing")),
      el("div", { class: "stat" }, el("div", {}, companies.filter(c => c.linkedin_only).length), el("div", {}, "LinkedIn only")),
      el("div", { class: "stat" }, el("div", {}, li.cards ?? "—"), el("div", {}, "LinkedIn results")),
      el("div", { class: "stat" }, el("div", {}, ago(cov.updated_at)), el("div", {}, "last refresh")),
    ),
    el("div", { class: "cov-grid" },
      el("table", {},
        el("thead", {}, el("tr", {}, el("th", {}, "Company"), el("th", {}, "Status"), el("th", {}, "London roles"), el("th", {}, "All roles"))),
        el("tbody", {}, ...rows.map(c => el("tr", {},
          el("td", {}, c.name), el("td", {}, status(c), c.error ? el("div", { class: "sub" }, c.error.slice(0, 90)) : null),
          el("td", {}, c.london ?? "—"), el("td", {}, c.total ?? "—"))))),
      el("div", {},
        el("h3", { class: "meta" }, "Hiring in London, not on your watchlist (from LinkedIn)"),
        el("table", {},
          el("thead", {}, el("tr", {}, el("th", {}, "Company"), el("th", {}, "Roles seen"), el("th", {}, ""))),
          el("tbody", {}, ...(cov.discovered || []).map(d => el("tr", {}, el("td", {}, d.company), el("td", {}, d.postings),
            el("td", {}, addButton(d.company)))))),
        el("p", { class: "meta" }, "Adding looks for the company's own careers feed (a few seconds). New companies are fetched from the next refresh on.")),
    ),
  );
}

function addButton(company) {
  const btn = el("button", { class: "btn", type: "button" }, "Add to watchlist");
  btn.addEventListener("click", async () => {
    btn.disabled = true;
    btn.textContent = "Checking…";
    try {
      const entry = await api("/api/watchlist", { company });
      btn.textContent = entry.platform === "linkedin-only" ? "✓ Added (LinkedIn only)" : `✓ Added (${entry.platform})`;
    } catch (e) {
      btn.textContent = e.message.includes("already") ? "Already on list" : "Couldn't add";
    }
  });
  return btn;
}

async function save(p) {
  try {
    const result = await api("/api/save", { key: p.key });
    data.page_state.saved[p.key] = result;
    render();
  } catch (e) { console.error("save failed", e); }
}
async function hide(p, reason) {
  if (!reason) return;
  try {
    data.page_state.hidden[p.key] = await api("/api/hide", { key: p.key, reason });
    render();
  } catch (e) { console.error("hide failed", e); }
}
async function unhide(p) {
  try {
    await api("/api/unhide", { key: p.key });
    delete data.page_state.hidden[p.key];
    render();
  } catch (e) { console.error("unhide failed", e); }
}

function pollRefresh() {
  const timer = setInterval(async () => {
    try {
      const status = await api("/api/status");
      if (!status.refreshing) { clearInterval(timer); await load(); }
    } catch { clearInterval(timer); }
  }, 5000);
}

document.getElementById("refreshBtn").addEventListener("click", async () => {
  await api("/api/refresh", {});
  data.refreshing = true;
  renderHeader();
  render();
  pollRefresh();
});
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
  tab = b.dataset.tab;
  shown = PAGE_SIZE;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t === b)));
  render();
}));
let qTimer;
document.getElementById("q").addEventListener("input", e => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { filters.q = e.target.value.trim(); changed(); }, 150);
});
document.getElementById("maxYears").addEventListener("input", e => { filters.maxYears = Number(e.target.value); changed(); });
for (const id of ["includeUnknown", "newOnly", "showClosed", "salaryOnly", "hideRecruiters"]) {
  document.getElementById(id).addEventListener("change", e => { filters[id] = e.target.checked; changed(); });
}
document.getElementById("minSalary").addEventListener("change", e => { filters.minSalary = Number(e.target.value); changed(); });
document.getElementById("sort").addEventListener("change", e => { filters.sort = e.target.value; changed(); });
document.getElementById("reset").addEventListener("click", () => { filters = { ...DEFAULTS, sources: sources() }; changed(); });

load().catch(e => {
  document.getElementById("content").replaceChildren(el("div", { class: "empty" }, `Couldn't load radar data: ${e.message}`));
});
</script>
</body>
</html>
