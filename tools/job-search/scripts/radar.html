<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Cockpit</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<style>
  :root {
    --bg: #f7f7f5; --surface: #ffffff; --surface-2: #f0efeb; --border: #e3e1db;
    --text: #1d1c1a; --muted: #6b6860; --accent: #2f5bd3; --accent-soft: #e6ecfb;
    --good: #1f7a4d; --good-soft: #e3f3ea; --warn: #9a5b00; --warn-soft: #fbefd9;
    --bad: #b3261e; --bad-soft: #fbe4e2; --new: #6d28d9; --new-soft: #efe7fd;
    --radius: 10px; --shadow: 0 1px 2px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --surface: #1d1d1b; --surface-2: #262623; --border: #34332f;
      --text: #ecebe6; --muted: #9b988f; --accent: #8aa8ff; --accent-soft: #232c45;
      --good: #6fcf97; --good-soft: #1c3326; --warn: #f2b65c; --warn-soft: #3a2d17;
      --bad: #ff8a80; --bad-soft: #3d1f1d; --new: #c4a7ff; --new-soft: #2d2342;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--border); }
  .bar { max-width: 1180px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0 8px 0 0; letter-spacing: -.01em; }
  .meta { color: var(--muted); font-size: 12.5px; }
  .tabs { display: flex; gap: 4px; margin-left: auto; }
  .tab { border: 0; background: none; color: var(--muted); padding: 6px 10px; border-radius: 8px; cursor: pointer; font: inherit; }
  .tab[aria-selected="true"] { background: var(--surface-2); color: var(--text); font-weight: 600; }
  button, select, input { font: inherit; color: inherit; }
  .btn { white-space: nowrap; border: 1px solid var(--border); background: var(--surface); padding: 5px 10px; border-radius: 8px; cursor: pointer; }
  .btn:hover { border-color: var(--muted); }
  a.btn { text-decoration: none; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .55; cursor: default; }
  main { max-width: 1180px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: 260px 1fr; gap: 20px; }
  main.wide { grid-template-columns: 1fr; }
  aside { position: sticky; top: 70px; align-self: start; display: flex; flex-direction: column; gap: 16px;
    max-height: calc(100vh - 90px); overflow: auto; padding-right: 4px; }
  .group h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 3px 9px; cursor: pointer; font-size: 12.5px; }
  .chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  input[type=search], select.field, input[type=number] { width: 100%; padding: 7px 9px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--surface); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  label.check { display: flex; gap: 7px; align-items: center; font-size: 13px; cursor: pointer; margin-top: 4px; }
  .summary { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 10px; flex-wrap: wrap; }
  .summary strong { font-size: 15px; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card.closed { opacity: .6; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 11px 13px; cursor: pointer; }
  .title { font-weight: 600; font-size: 14.5px; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 1px; }
  .badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .badge { font-size: 11.5px; padding: 1px 7px; border-radius: 6px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .badge.good { background: var(--good-soft); color: var(--good); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.bad { background: var(--bad-soft); color: var(--bad); }
  .badge.new { background: var(--new-soft); color: var(--new); font-weight: 600; }
  .actions { display: flex; gap: 6px; align-items: flex-start; }
  .actions select { padding: 5px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); cursor: pointer; }
  .saved { color: var(--good); font-weight: 600; font-size: 13px; padding: 5px 4px; }
  .detail { border-top: 1px solid var(--border); padding: 12px 13px 14px; display: none; }
  .card.open .detail { display: block; }
  .evidence { background: var(--accent-soft); border-left: 3px solid var(--accent); padding: 8px 10px; border-radius: 6px; margin-bottom: 10px; font-size: 13px; }
  .evidence b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); margin-bottom: 2px; }
  .desc { white-space: pre-wrap; color: var(--text); font-size: 13px; max-height: 360px; overflow: auto; }
  .links { margin-top: 10px; display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; }
  a { color: var(--accent); }
  .empty, .notice { padding: 28px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius); }
  .notice { padding: 10px 14px; text-align: left; margin-bottom: 12px; border-style: solid; }
  .notice.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; background: var(--surface-2); }
  .cov-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; align-items: start; }
  .stat-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; min-width: 120px; }
  .stat div:first-child { font-size: 20px; font-weight: 700; }
  .stat div:last-child { color: var(--muted); font-size: 12px; }
  .more { margin: 12px auto 0; display: block; }
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; }
    aside { position: static; max-height: none; }
    .cov-grid { grid-template-columns: 1fr; }
    .row { grid-template-columns: 1fr; }
  }
  .block { margin-bottom: 22px; }
  .block h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px;
    display: flex; gap: 8px; align-items: center; }
  .count { background: var(--surface-2); color: var(--text); border-radius: 999px; padding: 0 8px; font-size: 12px; letter-spacing: 0; }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 11px 13px; margin-bottom: 8px; align-items: start; }
  .item .actions { flex-wrap: wrap; justify-content: flex-end; max-width: 460px; }
  #content, .item > div:first-child { min-width: 0; }
  .item .actions select { max-width: 190px; }
  .snippet { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .stat.met div:first-child { color: var(--good); }
  .cell-select { padding: 3px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); }
  .btn.tiny { padding: 1px 6px; font-size: 12px; margin-left: 4px; }
  tr.prow { cursor: pointer; }
  tr.prow:hover td { background: var(--surface-2); }
  .pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .pgrid h3, .insights h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 10px 0 6px; }
  .timeline, .contacts { margin: 0; padding-left: 18px; font-size: 13px; }
  .proof { display: flex; gap: 8px; margin: -4px 0 18px; }
  .proof input { flex: 1; padding: 6px 9px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  .insights { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 820px) {
    .pgrid, .insights, .item { grid-template-columns: 1fr; }
    table.pipeline { display: block; overflow-x: auto; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Job Cockpit</h1>
    <span class="meta" id="updated">Loading…</span>
    <button class="btn" id="refreshBtn" type="button">Refresh now</button>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="today" aria-selected="true">Today</button>
      <button class="tab" role="tab" data-tab="roles" aria-selected="false">Roles</button>
      <button class="tab" role="tab" data-tab="pipeline" aria-selected="false">Pipeline</button>
      <button class="tab" role="tab" data-tab="insights" aria-selected="false">Insights</button>
      <button class="tab" role="tab" data-tab="saved" aria-selected="false">Saved</button>
      <button class="tab" role="tab" data-tab="hidden" aria-selected="false">Hidden</button>
      <button class="tab" role="tab" data-tab="coverage" aria-selected="false">Coverage</button>
    </nav>
  </div>
</header>
<main id="main">
  <aside id="filters">
    <div class="group">
      <input type="search" id="q" placeholder="Search title, company, text…" aria-label="Search">
    </div>
    <div class="group">
      <h3>Skills fit: ≥ <span id="fitVal"></span></h3>
      <input type="range" id="minFit" min="0" max="100" step="10" aria-label="Minimum skills fit">
      <label class="check"><input type="checkbox" id="includeUnscored"> Include roles that can't be scored</label>
    </div>
    <div class="group">
      <h3>Years required: ≤ <span id="yearsVal"></span></h3>
      <input type="range" id="maxYears" min="0" max="10" step="1" aria-label="Maximum years required">
      <label class="check"><input type="checkbox" id="includeUnknown"> Include roles that don't say</label>
    </div>
    <div class="group">
      <h3>Show only</h3>
      <label class="check"><input type="checkbox" id="newOnly"> New since last visit</label>
      <label class="check"><input type="checkbox" id="showClosed"> Include closed postings</label>
      <label class="check"><input type="checkbox" id="hideRecruiters"> Hide recruitment agencies</label>
      <label class="check"><input type="checkbox" id="hideOtherLanguage"> Hide roles needing another language</label>
    </div>
    <div class="group">
      <h3>Role family</h3>
      <div class="chips" id="families"></div>
    </div>
    <div class="group">
      <h3>Level (from title)</h3>
      <div class="chips" id="levels"></div>
    </div>
    <div class="group">
      <h3>Minimum salary (if stated)</h3>
      <select class="field" id="minSalary">
        <option value="0">Any</option><option value="55000">£55k+</option>
        <option value="65000">£65k+</option><option value="80000">£80k+</option>
      </select>
      <label class="check"><input type="checkbox" id="salaryOnly"> Only roles that state a salary</label>
    </div>
    <div class="group">
      <h3>Source</h3>
      <div class="chips" id="sources"></div>
    </div>
    <div class="group">
      <h3>Sort</h3>
      <select class="field" id="sort">
        <option value="fit">Best fit first</option>
        <option value="new">Newest first</option>
        <option value="years">Fewest years first</option>
        <option value="company">Company A–Z</option>
      </select>
    </div>
    <button class="btn" id="reset" type="button">Reset filters</button>
  </aside>
  <section id="content"></section>
</main>

<script>
const FAMILIES = ["AI/FDE", "DevEx/Tools", "Infra/DevOps", "SWE", "Solutions", "TPM/Program", "Data/ML", "QA/Automation", "Mobile", "Security/IT", "Product", "Other", "Non-tech"];
const LEVELS = ["intern", "entry", "junior", "mid", "mid/senior", "unknown", "senior", "staff+", "manager"];
const HIDE_REASONS = ["too senior", "wrong work", "pay", "company", "other"];
const DEFAULTS = {
  q: "", maxYears: 3, includeUnknown: true, newOnly: false, showClosed: false, hideRecruiters: true,
  hideOtherLanguage: true, minFit: 60, includeUnscored: false,
  // The role families in profile.json; the rest are one click away.
  families: ["AI/FDE", "DevEx/Tools", "SWE", "Solutions", "TPM/Program", "QA/Automation"],
  levels: LEVELS.filter(l => !["intern", "senior", "staff+", "manager"].includes(l)),
  sources: null, minSalary: 0, salaryOnly: false, sort: "fit",
};
const PAGE_SIZE = 120;

let data = null, prevVisit = null, visited = false, tab = "today", shown = PAGE_SIZE;
let cockpit = null, flash = null;
const NO_FILTER_TABS = ["today", "pipeline", "insights", "coverage"];
const POSITIONING_LABELS = { P1: "P1 · AI tooling builder", P2: "P2 · platform engineer", P3: "P3 · FDE / solutions", P4: "P4 · technical program lead" };
const CHANNEL_LABELS = { easy_apply: "LinkedIn Easy Apply", ats: "Company careers site", agency: "Agency", referral: "Referral", other: "Other" };
const TIER_LABELS = { 1: "Tier 1 · tailored", 2: "Tier 2 · fast" };

async function loadCockpit() { cockpit = await api("/api/cockpit"); }

async function act(path, body) {
  try { await api(path, body); flash = null; }
  catch (e) { flash = e.message; }
  await loadCockpit();
  render();
}
function flashNotice() { return flash && el("div", { class: "notice warn" }, flash); }
function plusDays(n) { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
function selectTab(name) {
  tab = name;
  shown = PAGE_SIZE;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === name)));
  render();
}
let pipelineFilter = "active";
const pipelineOpen = new Set();

const openKeys = new Set();
let filters = loadFilters();

function loadFilters() {
  try { return { ...DEFAULTS, ...JSON.parse(localStorage.getItem("radar-filters-v3") || "{}") }; }
  catch { return { ...DEFAULTS }; }
}
function storeFilters() {
  try { localStorage.setItem("radar-filters-v3", JSON.stringify(filters)); } catch {}
}

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) {
    if (c === null || c === undefined || c === false) continue;
    node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return node;
}

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  const json = await res.json();
  if (!res.ok) throw new Error(json.error || res.statusText);
  return json;
}

async function load() {
  data = await api("/api/data");
  await loadCockpit();
  if (!visited) {
    prevVisit = data.page_state.last_visit;
    visited = true;
    api("/api/visit", {}).catch(() => {});
  }
  if (!filters.sources) filters.sources = sources();
  renderHeader();
  renderFilters();
  render();
  if (data.refreshing) pollRefresh();
}

function sources() {
  return [...new Set(data.postings.map(p => p.source))].sort();
}

function ago(iso) {
  if (!iso) return "never";
  const mins = Math.round((Date.now() - new Date(iso)) / 60000);
  if (mins < 2) return "just now";
  if (mins < 60) return `${mins} min ago`;
  const hours = Math.round(mins / 60);
  return hours < 36 ? `${hours} h ago` : `${Math.round(hours / 24)} days ago`;
}

function renderHeader() {
  const btn = document.getElementById("refreshBtn");
  btn.disabled = data.refreshing;
  btn.textContent = data.refreshing ? "Refreshing…" : "Refresh now";
  document.getElementById("updated").textContent =
    `Updated ${ago(data.updated_at)}` + (prevVisit ? ` · last visit ${ago(prevVisit)}` : "");
}

function isNew(p) {
  if (!prevVisit) return false;
  return p.first_seen > prevVisit.slice(0, 10);
}

function chipGroup(id, values, key) {
  const box = document.getElementById(id);
  box.replaceChildren(...values.map(v => el("button", {
    class: "chip", type: "button", "aria-pressed": String(filters[key].includes(v)),
    onclick: () => {
      filters[key] = filters[key].includes(v) ? filters[key].filter(x => x !== v) : [...filters[key], v];
      changed();
    },
  }, v)));
}

function renderFilters() {
  document.getElementById("q").value = filters.q;
  document.getElementById("minFit").value = filters.minFit;
  document.getElementById("fitVal").textContent = filters.minFit;
  document.getElementById("includeUnscored").checked = filters.includeUnscored;
  document.getElementById("maxYears").value = filters.maxYears;
  document.getElementById("yearsVal").textContent = filters.maxYears >= 10 ? "any" : filters.maxYears;
  document.getElementById("includeUnknown").checked = filters.includeUnknown;
  document.getElementById("newOnly").checked = filters.newOnly;
  document.getElementById("showClosed").checked = filters.showClosed;
  document.getElementById("hideRecruiters").checked = filters.hideRecruiters;
  document.getElementById("hideOtherLanguage").checked = filters.hideOtherLanguage;
  document.getElementById("minSalary").value = filters.minSalary;
  document.getElementById("salaryOnly").checked = filters.salaryOnly;
  document.getElementById("sort").value = filters.sort;
  chipGroup("families", FAMILIES, "families");
  chipGroup("levels", LEVELS, "levels");
  chipGroup("sources", sources(), "sources");
}

function changed() {
  shown = PAGE_SIZE;
  storeFilters();
  renderFilters();
  render();
}

function matches(p) {
  const f = filters;
  if (!f.showClosed && p.closed) return false;
  if (f.newOnly && !isNew(p)) return false;
  if (f.hideRecruiters && (p.flags || []).includes("recruiter")) return false;
  if (f.hideOtherLanguage && (p.flags || []).includes("other_language")) return false;
  if (p.fit === null || p.fit === undefined) {
    if (!f.includeUnscored) return false;
  } else if (p.fit < f.minFit) return false;
  if (p.years_min === null || p.years_min === undefined) {
    if (!f.includeUnknown) return false;
  } else if (f.maxYears < 10 && p.years_min > f.maxYears) return false;
  if (!f.families.includes(p.role_family)) return false;
  if (!f.levels.includes(p.level)) return false;
  if (!f.sources.includes(p.source)) return false;
  if (f.salaryOnly && !p.salary_min) return false;
  if (f.minSalary && p.salary_min && p.salary_min < f.minSalary) return false;
  if (f.q) {
    const hay = `${p.title} ${p.company} ${p.location} ${p.description || ""}`.toLowerCase();
    if (!f.q.toLowerCase().split(/\s+/).every(t => hay.includes(t))) return false;
  }
  return true;
}

function sortPostings(list) {
  const by = {
    fit: (a, b) => (b.fit ?? -1) - (a.fit ?? -1) || (b.first_seen || "").localeCompare(a.first_seen || ""),
    new: (a, b) => (b.first_seen || "").localeCompare(a.first_seen || "") || (a.years_min ?? 99) - (b.years_min ?? 99),
    years: (a, b) => (a.years_min ?? 99) - (b.years_min ?? 99) || (b.first_seen || "").localeCompare(a.first_seen || ""),
    company: (a, b) => (a.company || "").localeCompare(b.company || "") || a.title.localeCompare(b.title),
  }[filters.sort];
  return list.sort(by);
}

function yearsBadge(p) {
  if (p.years_min === null || p.years_min === undefined) return el("span", { class: "badge" }, "? yrs");
  const cls = p.years_min <= 2 ? "good" : p.years_min <= 3 ? "warn" : "bad";
  return el("span", { class: `badge ${cls}` }, `${p.years_min}+ yrs`);
}

function fitBadge(p) {
  if (p.fit === null || p.fit === undefined) return el("span", { class: "badge" }, "fit ?");
  const cls = p.fit >= 70 ? "good" : p.fit >= 50 ? "warn" : "bad";
  return el("span", { class: `badge ${cls}` }, p.fit_blocker ? `needs ${p.fit_blocker}` : `fit ${p.fit}`);
}

function skillsLine(p) {
  if (p.fit === null || p.fit === undefined) {
    return el("div", { class: "evidence" }, el("b", {}, "Skills fit"),
      p.description ? "The job ad doesn't name any technologies." : "No job ad text fetched yet, so it can't be scored.");
  }
  return el("div", { class: "evidence" }, el("b", {}, `Skills fit ${p.fit}`),
    [...(p.fit_have || []).map(s => `✓ ${s}`), ...(p.fit_missing || []).map(s => `✗ ${s}`)].join("  ·  "));
}

function card(p) {
  const state = data.page_state;
  const saved = state.saved[p.key];
  const hidden = state.hidden[p.key];
  const node = el("article", { class: `card${p.closed ? " closed" : ""}${openKeys.has(p.key) ? " open" : ""}` });

  const actions = el("div", { class: "actions", onclick: e => e.stopPropagation() });
  if (hidden) {
    actions.append(el("button", { class: "btn", type: "button", onclick: () => unhide(p) }, `Unhide (${hidden.reason})`));
  } else {
    actions.append(saved
      ? el("span", { class: "saved" }, "✓ Saved")
      : el("select", { "aria-label": "Save this role", onchange: e => e.target.value && save(p, Number(e.target.value)) },
          el("option", { value: "" }, "☆ Save as…"),
          el("option", { value: "1" }, "Tier 1 · tailor + warm path"),
          el("option", { value: "2" }, "Tier 2 · fast apply")));
    const select = el("select", { "aria-label": "Hide this role", onchange: e => hide(p, e.target.value) },
      el("option", { value: "" }, "Hide…"), ...HIDE_REASONS.map(r => el("option", { value: r }, r)));
    actions.append(select);
  }
  actions.append(el("a", { class: "btn", href: p.url, target: "_blank", rel: "noopener" }, "Open ↗"));

  const badges = el("div", { class: "badges" },
    isNew(p) && el("span", { class: "badge new" }, "NEW"),
    fitBadge(p),
    yearsBadge(p),
    el("span", { class: "badge" }, p.role_family),
    p.level !== "unknown" && el("span", { class: "badge" }, p.level),
    p.salary && el("span", { class: "badge good" }, p.salary),
    el("span", { class: "badge" }, (p.sources || [p.source]).join(" + ")),
    p.flags && p.flags.includes("deal_breaker") && el("span", { class: "badge bad" }, "gambling?"),
    p.flags && p.flags.includes("recruiter") && el("span", { class: "badge warn" }, "agency"),
    p.flags && p.flags.includes("other_language") && el("span", { class: "badge warn" }, "other language"),
    p.closed && el("span", { class: "badge bad" }, "closed"),
    el("span", { class: "badge" }, `seen ${p.first_seen}`),
  );

  node.append(el("div", {
    class: "row", onclick: () => {
      openKeys.has(p.key) ? openKeys.delete(p.key) : openKeys.add(p.key);
      node.classList.toggle("open");
    },
  }, el("div", {}, el("div", { class: "title" }, p.title), el("div", { class: "sub" }, `${p.company} · ${p.location || "—"}`), badges), actions));

  const detail = el("div", { class: "detail" },
    skillsLine(p),
    p.years_evidence
      ? el("div", { class: "evidence" }, el("b", {}, `Why "${p.years_min}+ yrs"`), p.years_evidence)
      : el("div", { class: "evidence" }, el("b", {}, "Years"), p.description ? "The job ad doesn't state a number of years." : "No job ad text fetched yet (LinkedIn details are capped per day)."),
    p.description && el("div", { class: "desc" }, p.description),
    el("div", { class: "links" },
      el("a", { href: p.url, target: "_blank", rel: "noopener" }, "Original posting ↗"),
      ...(p.alt_urls || []).map(u => el("a", { href: u, target: "_blank", rel: "noopener" }, "Also on " + new URL(u).hostname.replace("www.", "") + " ↗")),
    ),
  );
  node.append(detail);
  return node;
}

function render() {
  const main = document.getElementById("main");
  const content = document.getElementById("content");
  const filtersEl = document.getElementById("filters");
  const noFilters = NO_FILTER_TABS.includes(tab);
  main.classList.toggle("wide", noFilters);
  filtersEl.hidden = noFilters;
  if (tab === "coverage") return content.replaceChildren(renderCoverage());
  if (tab === "today") return content.replaceChildren(renderToday());
  if (tab === "pipeline") return content.replaceChildren(renderPipeline());
  if (tab === "insights") return content.replaceChildren(renderInsights());

  const { hidden, saved } = data.page_state;
  let list;
  if (tab === "saved") list = data.postings.filter(p => saved[p.key]);
  else if (tab === "hidden") list = data.postings.filter(p => hidden[p.key]);
  else list = data.postings.filter(p => !hidden[p.key] && !saved[p.key] && matches(p));
  sortPostings(list);

  const openCount = data.postings.filter(p => !p.closed).length;
  const newCount = list.filter(isNew).length;
  const notices = [];
  if (data.refreshing) notices.push(el("div", { class: "notice" }, "Refreshing in the background. New roles will appear when it finishes (about 3 minutes)."));
  if (data.refresh_error) notices.push(el("div", { class: "notice warn" }, `Last refresh failed: ${data.refresh_error}`));

  const heading = {
    roles: [el("strong", {}, `${list.length} roles`), ` match your filters, out of ${openCount} open` + (newCount ? ` · ${newCount} new` : "")],
    saved: [el("strong", {}, `${list.length} saved`), " · also in your tracker (Tracker.md)"],
    hidden: [el("strong", {}, `${list.length} hidden`), " · they won't show in Roles again"],
  }[tab];

  const listEl = el("div", { class: "list" }, ...list.slice(0, shown).map(card));
  content.replaceChildren(
    ...notices,
    el("div", { class: "summary" }, el("div", {}, ...heading)),
    list.length ? listEl : el("div", { class: "empty" }, tab === "roles" ? "Nothing matches. Try lowering the skills fit or years sliders." : "Nothing here yet."),
    list.length > shown && el("button", { class: "btn more", type: "button", onclick: () => { shown += PAGE_SIZE; render(); } }, `Show ${Math.min(PAGE_SIZE, list.length - shown)} more`),
  );
}

function gmailLink(msgId) {
  return "https://mail.google.com/mail/u/0/#search/" + encodeURIComponent("rfc822msgid:" + msgId.replace(/[<>]/g, ""));
}
function section(title, count, body) {
  return el("section", { class: "block" }, el("h2", {}, title, el("span", { class: "count" }, count)), body);
}
function mailItem(i, buttons) {
  return el("div", { class: "card item" },
    el("div", {},
      el("div", { class: "title" }, i.subject || "(no subject)"),
      el("div", { class: "sub" }, `${i.sender} · ${i.date} · ${i.kind}`),
      i.snippet && el("div", { class: "snippet" }, i.snippet)),
    el("div", { class: "actions" }, ...buttons,
      el("a", { class: "btn", href: gmailLink(i.msg_id), target: "_blank", rel: "noopener" }, "Open in Gmail ↗")));
}
function kpiStrip(week) {
  const tile = (label, n, target) => el("div", { class: "stat" + (n >= target ? " met" : "") },
    el("div", {}, `${n}/${target}`), el("div", {}, label));
  return el("div", { class: "stat-row" },
    tile("applications this week", week.applications, week.targets.applications),
    tile("conversations this week", week.conversations, week.targets.conversations),
    tile("public-proof pieces", week.proof, week.targets.proof));
}
function rowLabel(r) { return `${r.company} — ${r.role}`; }

function renderToday() {
  const t = cockpit.today;
  const rowOptions = cockpit.pipeline.filter(r => r.status !== "Withdrawn").sort((a, b) => a.company.localeCompare(b.company));
  const empty = text => el("div", { class: "empty" }, text);

  const actions = t.actions.map(a => mailItem(a, [
    a.row && el("span", { class: "badge" }, rowLabel(a.row)),
    el("button", { class: "btn primary", type: "button", onclick: () => act("/api/inbox/done", { msg_id: a.msg_id }) }, "✓ Handled"),
  ]));
  const review = t.review.map(i => mailItem(i, [
    ...i.candidates.map(c => el("button", { class: "btn", type: "button",
      onclick: () => act("/api/inbox/resolve", { msg_id: i.msg_id, row_id: c.id }) }, `It's ${c.company}`)),
    el("select", { "aria-label": "Attach to another application",
      onchange: e => e.target.value && act("/api/inbox/resolve", { msg_id: i.msg_id, row_id: Number(e.target.value) }) },
      el("option", { value: "" }, "Another row…"), ...rowOptions.map(r => el("option", { value: r.id }, rowLabel(r)))),
    el("button", { class: "btn", type: "button", onclick: () => act("/api/inbox/resolve", { msg_id: i.msg_id }) }, "Ignore"),
  ]));
  const followups = t.followups.map(f => el("div", { class: "card item" },
    el("div", {}, el("div", { class: "title" }, rowLabel(f)), el("div", { class: "sub" }, f.reason)),
    el("div", { class: "actions" },
      f.status !== "Shortlisted" && el("button", { class: "btn", type: "button",
        onclick: () => act("/api/tracker", { id: f.id, followup_date: plusDays(7) }) }, "Followed up · remind in 7 days"),
      el("button", { class: "btn", type: "button", onclick: () => { pipelineOpen.add(f.id); pipelineFilter = "all"; selectTab("pipeline"); } }, "Open in Pipeline"))));
  const changes = t.recent_changes.map(c => el("div", { class: "card item" },
    el("div", {}, el("div", { class: "title" }, rowLabel(c.row)),
      el("div", { class: "sub" }, `${c.from || "—"} → ${c.to} · ${c.source === "auto" ? "no reply in 21 days" : "from an email"} · ${c.date}`)),
    el("div", { class: "actions" }, c.undoable && el("button", { class: "btn", type: "button",
      onclick: () => act("/api/inbox/undo", { row_id: c.row.id }) }, "Undo"))));

  return el("div", {},
    flashNotice(),
    cockpit.inbox_error && el("div", { class: "notice warn" }, `Last inbox sync failed: ${cockpit.inbox_error}`),
    el("div", { class: "summary" },
      el("div", {}, el("strong", {}, "Today"), ` · inbox synced ${t.last_sync ? ago(t.last_sync) : "never"}`),
      el("button", { class: "btn", type: "button", disabled: cockpit.inbox_syncing, onclick: syncInbox },
        cockpit.inbox_syncing ? "Syncing…" : "Sync inbox now")),
    kpiStrip(cockpit.insights.week),
    el("form", { class: "proof", onsubmit: e => { e.preventDefault(); act("/api/proof", { title: e.target.elements.title.value }); } },
      el("input", { name: "title", placeholder: "Log a public-proof piece (post, repo, talk)…", required: true, "aria-label": "Public-proof piece" }),
      el("button", { class: "btn", type: "submit" }, "Log")),
    t.positioning_to_confirm > 0 && el("div", { class: "notice" }, `${t.positioning_to_confirm} applications have a guessed positioning. `,
      el("a", { href: "#", onclick: e => { e.preventDefault(); pipelineFilter = "all"; selectTab("pipeline"); } }, "Confirm them in Pipeline")),
    section("Needs a reply", t.actions.length, actions.length ? el("div", {}, ...actions) : empty("Nothing waiting on you.")),
    section("Check these emails", t.review.length, review.length ? el("div", {}, ...review) : empty("No emails to sort.")),
    section("Follow-ups due", t.followups.length, followups.length ? el("div", {}, ...followups) : empty("No follow-ups due.")),
    section("Automatic changes · last 7 days", t.recent_changes.length, changes.length ? el("div", {}, ...changes) : empty("No automatic changes this week.")),
  );
}

async function syncInbox() {
  await act("/api/inbox/sync", {});
  const timer = setInterval(async () => {
    try { await loadCockpit(); } catch { clearInterval(timer); return; }
    if (!cockpit.inbox_syncing) clearInterval(timer);
    render();
  }, 3000);
}

const STATUS_GROUPS = {
  active: ["Applied", "Responded", "Phone Screen", "Interviewing", "Offer"],
  shortlisted: ["Shortlisted"],
  closed: ["Rejected", "Ghosted", "Withdrawn"],
  all: null,
};

function fieldSelect(row, key, values, label, labels = {}, allowBlank = true) {
  return el("select", { class: "cell-select", "aria-label": label, onclick: e => e.stopPropagation(),
    onchange: e => {
      const v = e.target.value;
      act("/api/tracker", { id: row.id, [key]: v === "" ? null : key === "tier" ? Number(v) : v });
    } },
    allowBlank && el("option", { value: "" }, "—"),
    ...values.map(v => el("option", { value: v, selected: row[key] === v }, labels[v] || (key === "tier" ? `Tier ${v}` : v))));
}

function renderPipeline() {
  const o = cockpit.options;
  const group = STATUS_GROUPS[pipelineFilter];
  const rows = cockpit.pipeline.filter(r => !group || group.includes(r.status))
    .sort((a, b) => (b.applied_date || b.found_date || "").localeCompare(a.applied_date || a.found_date || ""));
  const count = g => cockpit.pipeline.filter(r => !STATUS_GROUPS[g] || STATUS_GROUPS[g].includes(r.status)).length;
  const chips = el("div", { class: "chips" }, ...Object.keys(STATUS_GROUPS).map(g => el("button", {
    class: "chip", type: "button", "aria-pressed": String(g === pipelineFilter),
    onclick: () => { pipelineFilter = g; render(); } }, `${g} (${count(g)})`)));

  function rowsFor(r) {
    const contacts = cockpit.contacts[r.id] || [];
    const open = pipelineOpen.has(r.id);
    const tr = el("tr", { class: "prow", onclick: () => { open ? pipelineOpen.delete(r.id) : pipelineOpen.add(r.id); render(); } },
      el("td", {}, el("div", { class: "title" }, r.company), el("div", { class: "sub" }, r.role)),
      el("td", {}, fieldSelect(r, "status", o.statuses, "Status", {}, false)),
      el("td", {}, fieldSelect(r, "tier", o.tiers, "Tier")),
      el("td", {}, fieldSelect(r, "channel", o.channels, "Channel", CHANNEL_LABELS)),
      el("td", {}, fieldSelect(r, "positioning", o.positionings, "Positioning"),
        r.positioning_inferred && el("button", { class: "btn tiny", type: "button", title: "This was guessed from the title. Click to confirm it.",
          onclick: e => { e.stopPropagation(); act("/api/tracker", { id: r.id, positioning: r.positioning }); } }, "confirm")),
      el("td", {}, r.applied_date || "—"),
      el("td", {}, contacts.length ? `${contacts.length} 👤` : "—"));
    return open ? [tr, el("tr", {}, el("td", { colspan: 7 }, pipelineDetail(r, contacts)))] : [tr];
  }

  return el("div", {},
    flashNotice(),
    el("div", { class: "summary" }, el("div", {}, el("strong", {}, `${rows.length} applications`), " · click a row for history and Tier 1 helpers"), chips),
    rows.length
      ? el("table", { class: "pipeline" },
          el("thead", {}, el("tr", {}, ...["Company / role", "Status", "Tier", "Channel", "Positioning", "Applied", "Contacts"].map(h => el("th", {}, h)))),
          el("tbody", {}, ...rows.flatMap(rowsFor)))
      : el("div", { class: "empty" }, "Nothing in this group."));
}

function pipelineDetail(r, contacts) {
  const events = (r.events || []).slice().reverse();
  return el("div", { class: "pgrid" },
    el("div", {},
      el("h3", {}, "History"),
      events.length
        ? el("ul", { class: "timeline" }, ...events.map(e => el("li", {},
            el("span", { class: "meta" }, e.date || "date unknown"), " ",
            e.type === "status" ? `${e.from || "—"} → ${e.to}` : `${e.kind} email: ${e.subject || ""}`,
            e.source && e.source !== "manual" && el("span", { class: "meta" }, ` (${e.source})`))))
        : el("div", { class: "meta" }, "No history yet."),
      r.notes && el("p", { class: "sub" }, r.notes)),
    el("div", {},
      el("h3", {}, "Tier 1 helpers"),
      el("div", { class: "links" },
        r.link && el("a", { href: r.link, target: "_blank", rel: "noopener" }, "Job posting ↗"),
        el("button", { class: "btn", type: "button", onclick: e => copyTailor(r, e.target) }, "Copy /resume-tailor command")),
      el("h3", {}, `People you know at ${r.company}`),
      contacts.length
        ? el("ul", { class: "contacts" }, ...contacts.map(c => el("li", {},
            c.url ? el("a", { href: c.url, target: "_blank", rel: "noopener" }, c.name) : c.name,
            c.position ? ` — ${c.position}` : "")))
        : el("div", { class: "meta" }, "No connections found in your LinkedIn export.")));
}

async function copyTailor(r, button) {
  const cmd = `/resume-tailor ${r.role} at ${r.company}${r.link ? " " + r.link : ""}`;
  try { await navigator.clipboard.writeText(cmd); button.textContent = "Copied ✓"; }
  catch { button.textContent = cmd; }
}

function pct(x) { return `${Math.round(x * 100)}%`; }

function breakdownTable(title, groups, labels) {
  const entries = Object.entries(groups);
  return el("div", {}, el("h3", {}, title),
    entries.length
      ? el("table", {},
          el("thead", {}, el("tr", {}, ...["", "Applied", "Conversations", "Rate", "Rejected", "Ghosted"].map(h => el("th", {}, h)))),
          el("tbody", {}, ...entries.map(([k, g]) => el("tr", {},
            el("td", {}, labels[k] || k),
            el("td", {}, g.applied), el("td", {}, g.conversations),
            el("td", {}, pct(g.rate), g.low_sample && el("span", { class: "meta", title: "Fewer than 5 applications: too few to trust" }, " · few")),
            el("td", {}, g.rejected), el("td", {}, g.ghosted)))))
      : el("div", { class: "meta" }, "No applications yet."));
}

function renderInsights() {
  const i = cockpit.insights;
  const f = i.funnel;
  const tile = (n, label) => el("div", { class: "stat" }, el("div", {}, n), el("div", {}, label));
  return el("div", {},
    el("div", { class: "summary" }, el("div", {}, el("strong", {}, "Insights"),
      " · conversation = any reply or invite that moved past Applied")),
    kpiStrip(i.week),
    el("div", { class: "stat-row" },
      tile(f.applied, "applied"), tile(f.heard_back, "heard back"), tile(f.conversations, "conversations"),
      tile(f.interviewing, "interviewing"), tile(f.offers, "offers"), tile(f.rejected, "rejected"),
      tile(f.ghosted, "ghosted"), tile(f.waiting, "still waiting"),
      tile(i.median_days_to_response === null ? "—" : `${i.median_days_to_response}d`, "median time to a response")),
    el("div", { class: "insights" },
      breakdownTable("By channel", i.by_channel, CHANNEL_LABELS),
      breakdownTable("By positioning", i.by_positioning, POSITIONING_LABELS),
      breakdownTable("By tier", i.by_tier, TIER_LABELS)));
}

function renderCoverage() {
  const cov = data.coverage;
  if (!cov) return el("div", { class: "empty" }, "No coverage data yet. Run a refresh.");
  const companies = cov.companies;
  const fetched = companies.filter(c => c.ok !== null && c.ok !== undefined);
  const failing = companies.filter(c => c.ok === false);
  const li = cov.linkedin || {};
  const status = c => c.linkedin_only ? el("span", { class: "badge" }, "LinkedIn only")
    : c.ok ? el("span", { class: "badge good" }, "ok") : el("span", { class: "badge bad" }, "failing");
  const rows = [...companies].sort((a, b) => (a.ok === false ? -1 : 0) - (b.ok === false ? -1 : 0) || (b.london ?? -1) - (a.london ?? -1));
  return el("div", {},
    el("div", { class: "stat-row" },
      el("div", { class: "stat" }, el("div", {}, fetched.length), el("div", {}, "career pages checked")),
      el("div", { class: "stat" }, el("div", {}, failing.length), el("div", {}, "failing")),
      el("div", { class: "stat" }, el("div", {}, companies.filter(c => c.linkedin_only).length), el("div", {}, "LinkedIn only")),
      el("div", { class: "stat" }, el("div", {}, li.cards ?? "—"), el("div", {}, "LinkedIn results")),
      el("div", { class: "stat" }, el("div", {}, ago(cov.updated_at)), el("div", {}, "last refresh")),
    ),
    el("div", { class: "cov-grid" },
      el("table", {},
        el("thead", {}, el("tr", {}, el("th", {}, "Company"), el("th", {}, "Status"), el("th", {}, "London roles"), el("th", {}, "All roles"))),
        el("tbody", {}, ...rows.map(c => el("tr", {},
          el("td", {}, c.name), el("td", {}, status(c), c.error ? el("div", { class: "sub" }, c.error.slice(0, 90)) : null),
          el("td", {}, c.london ?? "—"), el("td", {}, c.total ?? "—"))))),
      el("div", {},
        el("h3", { class: "meta" }, "Hiring in London, not on your watchlist (from LinkedIn)"),
        el("table", {},
          el("thead", {}, el("tr", {}, el("th", {}, "Company"), el("th", {}, "Roles seen"), el("th", {}, ""))),
          el("tbody", {}, ...(cov.discovered || []).map(d => el("tr", {}, el("td", {}, d.company), el("td", {}, d.postings),
            el("td", {}, addButton(d.company)))))),
        el("p", { class: "meta" }, "Adding looks for the company's own careers feed (a few seconds). New companies are fetched from the next refresh on.")),
    ),
  );
}

function addButton(company) {
  const btn = el("button", { class: "btn", type: "button" }, "Add to watchlist");
  btn.addEventListener("click", async () => {
    btn.disabled = true;
    btn.textContent = "Checking…";
    try {
      const entry = await api("/api/watchlist", { company });
      btn.textContent = entry.platform === "linkedin-only" ? "✓ Added (LinkedIn only)" : `✓ Added (${entry.platform})`;
    } catch (e) {
      btn.textContent = e.message.includes("already") ? "Already on list" : "Couldn't add";
    }
  });
  return btn;
}

async function save(p, tier) {
  try {
    data.page_state.saved[p.key] = await api("/api/save", { key: p.key, tier });
    await loadCockpit();
    render();
  } catch (e) { console.error("save failed", e); }
}

async function hide(p, reason) {
  if (!reason) return;
  try {
    data.page_state.hidden[p.key] = await api("/api/hide", { key: p.key, reason });
    render();
  } catch (e) { console.error("hide failed", e); }
}
async function unhide(p) {
  try {
    await api("/api/unhide", { key: p.key });
    delete data.page_state.hidden[p.key];
    render();
  } catch (e) { console.error("unhide failed", e); }
}

function pollRefresh() {
  const timer = setInterval(async () => {
    try {
      const status = await api("/api/status");
      if (!status.refreshing) { clearInterval(timer); await load(); }
    } catch { clearInterval(timer); }
  }, 5000);
}

document.getElementById("refreshBtn").addEventListener("click", async () => {
  await api("/api/refresh", {});
  data.refreshing = true;
  renderHeader();
  render();
  pollRefresh();
});
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => selectTab(b.dataset.tab)));
let qTimer;
document.getElementById("q").addEventListener("input", e => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { filters.q = e.target.value.trim(); changed(); }, 150);
});
document.getElementById("maxYears").addEventListener("input", e => { filters.maxYears = Number(e.target.value); changed(); });
document.getElementById("minFit").addEventListener("input", e => { filters.minFit = Number(e.target.value); changed(); });
for (const id of ["includeUnscored", "includeUnknown", "newOnly", "showClosed", "salaryOnly", "hideRecruiters", "hideOtherLanguage"]) {
  document.getElementById(id).addEventListener("change", e => { filters[id] = e.target.checked; changed(); });
}
document.getElementById("minSalary").addEventListener("change", e => { filters.minSalary = Number(e.target.value); changed(); });
document.getElementById("sort").addEventListener("change", e => { filters.sort = e.target.value; changed(); });
document.getElementById("reset").addEventListener("click", () => { filters = { ...DEFAULTS, sources: sources() }; changed(); });

load().catch(e => {
  document.getElementById("content").replaceChildren(el("div", { class: "empty" }, `Couldn't load radar data: ${e.message}`));
});
</script>
